networks:
  smart-network:
    driver: bridge

volumes:
  mysql_data:

services:
  # ==========================================
  # 1. Database Tier: MySQL 8.0
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: smart-attendance-mysql
    restart: unless-stopped
    networks:
      - smart-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Theraghu@5e8}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school_management_system}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pTheraghu@5e8"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 4s

  # ==========================================
  # 2. Service Discovery: Eureka Server
  # ==========================================
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    image: smart-attendance/eureka-server:latest
    container_name: smart-attendance-eureka
    restart: unless-stopped
    networks:
      - smart-network
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx200m -XX:+UseSerialGC -Dspring.main.lazy-initialization=true -Djava.security.egd=file:/dev/./urandom"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/eureka/apps || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ==========================================
  # 3. API Gateway: Spring Cloud Gateway
  # ==========================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: smart-attendance/api-gateway:latest
    container_name: smart-attendance-gateway
    restart: unless-stopped
    networks:
      - smart-network
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx220m -XX:+UseSerialGC -Dspring.main.lazy-initialization=true -Djava.security.egd=file:/dev/./urandom"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy

  # ==========================================
  # 4. Domain Microservices (Parallel Launch)
  # ==========================================
  registration-service:
    build:
      context: ./backend/registration-service
      dockerfile: Dockerfile
    image: smart-attendance/registration-service:latest
    container_name: smart-attendance-registration
    restart: unless-stopped
    networks:
      - smart-network
    ports:
      - "8081:8081"
    environment:
      JAVA_OPTS: "-XX:TieredStopAtLevel=1 -Xms64m -Xmx200m -XX:+UseSerialGC -Dspring.main.lazy-initialization=true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school_management_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Theraghu@5e8}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: registration-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy

