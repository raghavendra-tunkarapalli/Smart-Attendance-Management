spring.cloud.gateway.routes[7].uri=lb://STAFF-ENQUIRY-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/staff/enquiries/**

# Route 8: Student Portal Service
spring.cloud.gateway.routes[8].id=student-portal-service
spring.cloud.gateway.routes[8].uri=lb://STUDENT-PORTAL-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/student-portal/**

# Route 9: Teacher Portal Service
spring.cloud.gateway.routes[9].id=teacher-portal-service
spring.cloud.gateway.routes[9].uri=lb://TEACHER-PORTAL-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/teacher-portal/**

# Route 10: Staff Portal Service
spring.cloud.gateway.routes[10].id=staff-portal-service
